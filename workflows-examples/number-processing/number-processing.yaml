apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: number-processing
spec:
  entrypoint: process-with-script
  arguments:
    parameters:
      - name: operation
        value: multiply
        description: Operation to perform on numbers (multiply, square, or sum)
      - name: factor
        value: "2"
        description: Factor to multiply by (if using multiply operation)
      - name: numbersInput
        value: "public/input/numbers.csv"
        description: numbers to be processed
      - name: artifactOutputPath
        value: "public/output"
        description: User-specific output path
      - name: scriptKey
        description: S3 key for the script to use
        value: "public/scripts/number-processing/process.py"
      - name: dockerfileKey
        description: S3 key for the Dockerfile (optional)
        value: "public/scripts/number-processing/Dockerfile"
      - name: requirementsKey
        description: S3 key for requirements.txt (optional)
        value: "public/scripts/number-processing/requirements.txt"
      - name: entrypointKey
        description: S3 key for entrypoint.sh
        value: "public/scripts/number-processing/entrypoint.sh"

  templates:
    - name: process-with-script
      inputs:
        parameters:
          - name: operation
          - name: factor
          - name: numbersInput
          - name: artifactOutputPath
          - name: scriptKey
          - name: dockerfileKey
          - name: requirementsKey
          - name: entrypointKey
        artifacts:
          - name: input-numbers
            path: /tmp/input/numbers.csv
            s3:
              key: "{{inputs.parameters.numbersInput}}"
              bucket: pipeline-runner-artifacts
          - name: script-file
            path: /tmp/scripts/script.py
            s3:
              key: "{{inputs.parameters.scriptKey}}"
              bucket: pipeline-runner-artifacts
          - name: dockerfile
            path: /tmp/scripts/Dockerfile
            optional: true
            s3:
              key: "{{inputs.parameters.dockerfileKey}}"
              bucket: pipeline-runner-artifacts
          - name: requirements
            path: /tmp/scripts/requirements.txt
            optional: true
            s3:
              key: "{{inputs.parameters.requirementsKey}}"
              bucket: pipeline-runner-artifacts
          - name: entrypoint
            path: /tmp/scripts/entrypoint.sh
            s3:
              key: "{{inputs.parameters.entrypointKey}}"
              bucket: pipeline-runner-artifacts
      container:
        image: python:3.9-slim
        command: ["/bin/bash", "/tmp/scripts/entrypoint.sh"]
        args: ["{{inputs.parameters.operation}}", "{{inputs.parameters.factor}}"]
      outputs:
        artifacts:
          - name: output-results
            path: /tmp/output/results.csv
            s3:
              key: "{{inputs.parameters.artifactOutputPath}}/results.csv"
              bucket: pipeline-runner-artifacts