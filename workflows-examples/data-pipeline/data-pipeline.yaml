apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: data-pipeline
spec:
  entrypoint: full-pipeline
  arguments:
    parameters:
      - name: inputDataPath
        value: "public/input/sample-data.csv"
        description: Path to the input data CSV
      - name: outputBasePath
        value: "public/output/data-pipeline"
        description: Base path for all output artifacts
      - name: transformScriptKey
        value: "public/scripts/data-pipeline/transform/process.py"
        description: S3 key for the transformation script
      - name: transformReqKey
        value: "public/scripts/data-pipeline/transform/requirements.txt"
        description: S3 key for transformation requirements
      - name: transformEntryKey
        value: "public/scripts/data-pipeline/transform/entrypoint.sh"
        description: S3 key for transformation entrypoint script
      - name: normalizeScriptKey
        value: "public/scripts/data-pipeline/normalize/process.py"
        description: S3 key for the normalization script
      - name: normalizeReqKey
        value: "public/scripts/data-pipeline/normalize/requirements.txt"
        description: S3 key for normalization requirements
      - name: normalizeEntryKey
        value: "public/scripts/data-pipeline/normalize/entrypoint.sh"
        description: S3 key for normalization entrypoint script
      - name: analyzeScriptKey
        value: "public/scripts/data-pipeline/analyze/process.py"
        description: S3 key for the analysis script
      - name: analyzeReqKey
        value: "public/scripts/data-pipeline/analyze/requirements.txt"
        description: S3 key for analysis requirements
      - name: analyzeEntryKey
        value: "public/scripts/data-pipeline/analyze/entrypoint.sh"
        description: S3 key for analysis entrypoint script
      - name: visualizeScriptKey
        value: "public/scripts/data-pipeline/visualize/process.py"
        description: S3 key for the visualization script
      - name: visualizeReqKey
        value: "public/scripts/data-pipeline/visualize/requirements.txt"
        description: S3 key for visualization requirements
      - name: visualizeEntryKey
        value: "public/scripts/data-pipeline/visualize/entrypoint.sh"
        description: S3 key for visualization entrypoint script

  templates:
    - name: full-pipeline
      dag:
        tasks:
          - name: transform
            template: transform-data
            arguments:
              parameters:
                - name: inputDataPath
                  value: "{{workflow.parameters.inputDataPath}}"
                - name: outputPath
                  value: "{{workflow.parameters.outputBasePath}}/transform"
                - name: scriptKey
                  value: "{{workflow.parameters.transformScriptKey}}"
                - name: requirementsKey
                  value: "{{workflow.parameters.transformReqKey}}"
                - name: entrypointKey
                  value: "{{workflow.parameters.transformEntryKey}}"

          - name: normalize
            template: normalize-data
            depends: "transform"
            arguments:
              parameters:
                - name: inputDataPath
                  value: "{{workflow.parameters.outputBasePath}}/transform/transformed-data.csv"
                - name: outputPath
                  value: "{{workflow.parameters.outputBasePath}}/normalize"
                - name: scriptKey
                  value: "{{workflow.parameters.normalizeScriptKey}}"
                - name: requirementsKey
                  value: "{{workflow.parameters.normalizeReqKey}}"
                - name: entrypointKey
                  value: "{{workflow.parameters.normalizeEntryKey}}"

          - name: analyze
            template: analyze-data
            depends: "normalize"
            arguments:
              parameters:
                - name: inputDataPath
                  value: "{{workflow.parameters.outputBasePath}}/normalize/normalized-data.csv"
                - name: outputPath
                  value: "{{workflow.parameters.outputBasePath}}/analyze"
                - name: scriptKey
                  value: "{{workflow.parameters.analyzeScriptKey}}"
                - name: requirementsKey
                  value: "{{workflow.parameters.analyzeReqKey}}"
                - name: entrypointKey
                  value: "{{workflow.parameters.analyzeEntryKey}}"

          - name: visualize
            template: visualize-data
            depends: "analyze"
            arguments:
              parameters:
                - name: categoryAnalysisPath
                  value: "{{workflow.parameters.outputBasePath}}/analyze/category-analysis.csv"
                - name: regionAnalysisPath
                  value: "{{workflow.parameters.outputBasePath}}/analyze/region-analysis.csv" 
                - name: timeAnalysisPath
                  value: "{{workflow.parameters.outputBasePath}}/analyze/time-analysis.csv"
                - name: normalizedDataPath
                  value: "{{workflow.parameters.outputBasePath}}/normalize/normalized-data.csv"
                - name: outputPath
                  value: "{{workflow.parameters.outputBasePath}}/visualize"
                - name: scriptKey
                  value: "{{workflow.parameters.visualizeScriptKey}}"
                - name: requirementsKey
                  value: "{{workflow.parameters.visualizeReqKey}}"
                - name: entrypointKey
                  value: "{{workflow.parameters.visualizeEntryKey}}"

    - name: transform-data
      inputs:
        parameters:
          - name: inputDataPath
          - name: outputPath
          - name: scriptKey
          - name: requirementsKey
          - name: entrypointKey
        artifacts:
          - name: input-data
            path: /tmp/input/sample-data.csv
            s3:
              key: "{{inputs.parameters.inputDataPath}}"
              bucket: pipeline-runner-artifacts
          - name: script-file
            path: /tmp/scripts/script.py
            s3:
              key: "{{inputs.parameters.scriptKey}}"
              bucket: pipeline-runner-artifacts
          - name: requirements
            path: /tmp/scripts/requirements.txt
            s3:
              key: "{{inputs.parameters.requirementsKey}}"
              bucket: pipeline-runner-artifacts
          - name: entrypoint
            path: /tmp/scripts/entrypoint.sh
            s3:
              key: "{{inputs.parameters.entrypointKey}}"
              bucket: pipeline-runner-artifacts
      container:
        image: python:3.9-slim
        command: ["/bin/bash", "/tmp/scripts/entrypoint.sh"]
      outputs:
        artifacts:
          - name: transformed-data
            path: /tmp/output/transformed-data.csv
            archive:
              none: {}
            s3:
              key: "{{inputs.parameters.outputPath}}/transformed-data.csv"
              bucket: pipeline-runner-artifacts

    - name: normalize-data
      inputs:
        parameters:
          - name: inputDataPath
          - name: outputPath
          - name: scriptKey
          - name: requirementsKey
          - name: entrypointKey
        artifacts:
          - name: input-data
            path: /tmp/input/transformed-data.csv
            s3:
              key: "{{inputs.parameters.inputDataPath}}"
              bucket: pipeline-runner-artifacts
          - name: script-file
            path: /tmp/scripts/script.py
            s3:
              key: "{{inputs.parameters.scriptKey}}"
              bucket: pipeline-runner-artifacts
          - name: requirements
            path: /tmp/scripts/requirements.txt
            s3:
              key: "{{inputs.parameters.requirementsKey}}"
              bucket: pipeline-runner-artifacts
          - name: entrypoint
            path: /tmp/scripts/entrypoint.sh
            s3:
              key: "{{inputs.parameters.entrypointKey}}"
              bucket: pipeline-runner-artifacts
      container:
        image: python:3.9-slim
        command: ["/bin/bash", "/tmp/scripts/entrypoint.sh"]
      outputs:
        artifacts:
          - name: normalized-data
            path: /tmp/output/normalized-data.csv
            archive:
              none: {}
            s3:
              key: "{{inputs.parameters.outputPath}}/normalized-data.csv"
              bucket: pipeline-runner-artifacts

    - name: analyze-data
      inputs:
        parameters:
          - name: inputDataPath
          - name: outputPath
          - name: scriptKey
          - name: requirementsKey
          - name: entrypointKey
        artifacts:
          - name: input-data
            path: /tmp/input/normalized-data.csv
            s3:
              key: "{{inputs.parameters.inputDataPath}}"
              bucket: pipeline-runner-artifacts
          - name: script-file
            path: /tmp/scripts/script.py
            s3:
              key: "{{inputs.parameters.scriptKey}}"
              bucket: pipeline-runner-artifacts
          - name: requirements
            path: /tmp/scripts/requirements.txt
            s3:
              key: "{{inputs.parameters.requirementsKey}}"
              bucket: pipeline-runner-artifacts
          - name: entrypoint
            path: /tmp/scripts/entrypoint.sh
            s3:
              key: "{{inputs.parameters.entrypointKey}}"
              bucket: pipeline-runner-artifacts
      container:
        image: python:3.9-slim
        command: ["/bin/bash", "/tmp/scripts/entrypoint.sh"]
      outputs:
        artifacts:
          - name: analysis-results
            path: /tmp/output/analysis-results.csv
            archive:
              none: {}
            s3:
              key: "{{inputs.parameters.outputPath}}/analysis-results.csv"
              bucket: pipeline-runner-artifacts
          - name: category-analysis
            path: /tmp/output/category-analysis.csv
            archive:
              none: {}
            s3:
              key: "{{inputs.parameters.outputPath}}/category-analysis.csv"
              bucket: pipeline-runner-artifacts
          - name: region-analysis
            path: /tmp/output/region-analysis.csv
            archive:
              none: {}
            s3:
              key: "{{inputs.parameters.outputPath}}/region-analysis.csv"
              bucket: pipeline-runner-artifacts
          - name: time-analysis
            path: /tmp/output/time-analysis.csv
            archive:
              none: {}
            s3:
              key: "{{inputs.parameters.outputPath}}/time-analysis.csv"
              bucket: pipeline-runner-artifacts

    - name: visualize-data
      inputs:
        parameters:
          - name: categoryAnalysisPath
          - name: regionAnalysisPath
          - name: timeAnalysisPath
          - name: normalizedDataPath
          - name: outputPath
          - name: scriptKey
          - name: requirementsKey
          - name: entrypointKey
        artifacts:
          - name: category-analysis
            path: /tmp/input/category-analysis.csv
            s3:
              key: "{{inputs.parameters.categoryAnalysisPath}}"
              bucket: pipeline-runner-artifacts
          - name: region-analysis
            path: /tmp/input/region-analysis.csv
            s3:
              key: "{{inputs.parameters.regionAnalysisPath}}"
              bucket: pipeline-runner-artifacts
          - name: time-analysis
            path: /tmp/input/time-analysis.csv
            s3:
              key: "{{inputs.parameters.timeAnalysisPath}}"
              bucket: pipeline-runner-artifacts
          - name: normalized-data
            path: /tmp/input/normalized-data.csv
            s3:
              key: "{{inputs.parameters.normalizedDataPath}}"
              bucket: pipeline-runner-artifacts
          - name: script-file
            path: /tmp/scripts/script.py
            s3:
              key: "{{inputs.parameters.scriptKey}}"
              bucket: pipeline-runner-artifacts
          - name: requirements
            path: /tmp/scripts/requirements.txt
            s3:
              key: "{{inputs.parameters.requirementsKey}}"
              bucket: pipeline-runner-artifacts
          - name: entrypoint
            path: /tmp/scripts/entrypoint.sh
            s3:
              key: "{{inputs.parameters.entrypointKey}}"
              bucket: pipeline-runner-artifacts
      container:
        image: python:3.9-slim
        command: ["/bin/bash", "/tmp/scripts/entrypoint.sh"]
      outputs:
        artifacts:
          - name: report-data
            path: /tmp/output/report-data.json
            archive:
              none: {}
            s3:
              key: "{{inputs.parameters.outputPath}}/report-data.json"
              bucket: pipeline-runner-artifacts
          - name: sales-summary
            path: /tmp/output/sales-summary.csv
            archive:
              none: {}
            s3:
              key: "{{inputs.parameters.outputPath}}/sales-summary.csv"
              bucket: pipeline-runner-artifacts
          - name: category-chart
            path: /tmp/output/category-sales.png
            archive:
              none: {}
            s3:
              key: "{{inputs.parameters.outputPath}}/category-sales.png"
              bucket: pipeline-runner-artifacts
          - name: region-chart
            path: /tmp/output/region-sales.png
            archive:
              none: {}
            s3:
              key: "{{inputs.parameters.outputPath}}/region-sales.png"
              bucket: pipeline-runner-artifacts
          - name: time-chart
            path: /tmp/output/time-sales.png
            archive:
              none: {}
            s3:
              key: "{{inputs.parameters.outputPath}}/time-sales.png"
              bucket: pipeline-runner-artifacts