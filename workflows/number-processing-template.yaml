apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: number-processing
spec:
  entrypoint: process-numbers
  arguments:
    parameters:
      - name: operation
        value: multiply
        description: Operation to perform on numbers (multiply, square, or sum)
      - name: factor
        value: "2"
        description: Factor to multiply by (if using multiply operation)
      - name: artifactInputPath
        description: User-specific input path
      - name: artifactOutputPath
        description: User-specific output path

  templates:
    - name: process-numbers
      inputs:
        parameters:
          - name: operation
          - name: factor
          - name: artifactInputPath
          - name: artifactOutputPath
        artifacts:
          - name: input-numbers
            path: /tmp/input/numbers.csv
            s3:
              key: "{{inputs.parameters.artifactInputPath}}/numbers.csv"
              bucket: pipeline-runner-artifacts
      container:
        image: python:3.9-slim
        command: ["/bin/bash", "-c"]
        args:
          - |
            # Install required packages
            pip install pandas
            
            # Create a Python script file instead of using -c
            cat > /tmp/process.py << 'EOF'
            import pandas as pd
            import os
            
            # Load input CSV
            print("Loading input data...")
            df = pd.read_csv('/tmp/input/numbers.csv')
            print(f"Input data: {df.to_string()}")
            
            # Determine operation
            operation = "{{inputs.parameters.operation}}"
            factor = float("{{inputs.parameters.factor}}")
            
            # Process the numbers
            print(f"Performing operation: {operation} with factor {factor}")
            if operation == "multiply":
                df['result'] = df['value'] * factor
            elif operation == "square":
                df['result'] = df['value'] ** 2
            elif operation == "sum":
                total = df['value'].sum()
                df = pd.DataFrame({'id': [1], 'value': [0], 'result': [total]})
            else:
                # Default to multiply by 2
                df['result'] = df['value'] * 2
            
            # Save output
            print(f"Processed data: {df.to_string()}")
            os.makedirs('/tmp/output', exist_ok=True)
            output_path = '/tmp/output/results.csv'
            df.to_csv(output_path, index=False)
            print(f"Results saved to {output_path}")
            EOF
            
            # Run the script
            python3 /tmp/process.py
      outputs:
        artifacts:
          - name: output-results
            path: /tmp/output/results.csv
            s3:
              key: "{{inputs.parameters.artifactOutputPath}}/results.csv"
              bucket: pipeline-runner-artifacts