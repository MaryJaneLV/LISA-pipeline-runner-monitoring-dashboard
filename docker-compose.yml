version: '3.8'

services:
  # Backend API
  backend:
    build: ./backend
    container_name: scientific-workflow-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CORS_ORIGIN=http://localhost:30084
      - JWT_SECRET=your-secret-key-change-in-production
      - JWT_EXPIRES_IN=1d
      - ARGO_BASE_URL=http://argo-server.argo:2746
      - ARGO_NAMESPACE=argo
      - MINIO_ENDPOINT=minio.minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_DEFAULT_BUCKET=workflow-outputs
      - REDIS_URL=redis://redis.redis:6379
      - MONGODB_URI=mongodb://mongo:27017/scientific-workflow
    networks:
      - workflow-network
    depends_on:
      - mongo
    ports:
      - "30083:3000"

  # Frontend Web UI
  frontend:
    build: ./frontend
    container_name: scientific-workflow-frontend
    restart: unless-stopped
    environment:
      - REACT_APP_API_URL=http://localhost:30083
    networks:
      - workflow-network
    depends_on:
      - backend
    ports:
      - "30084:80"

  # MongoDB for backend data storage
  mongo:
    image: mongo:6.0
    container_name: scientific-workflow-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - workflow-network

networks:
  workflow-network:
    driver: bridge

volumes:
  mongo-data: