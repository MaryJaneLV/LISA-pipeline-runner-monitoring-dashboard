kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  extraPortMappings:
  - containerPort: 30080 # Argo UI
    hostPort: 30080
  - containerPort: 30081 # Kubernetes Dashboard
    hostPort: 30081
  - containerPort: 30082 # Minio Console
    hostPort: 30082
  - containerPort: 30083 # Backend API
    hostPort: 30083
  - containerPort: 30084 # Frontend
    hostPort: 30084
  extraMounts:
  - hostPath: ./data
    containerPath: /data
