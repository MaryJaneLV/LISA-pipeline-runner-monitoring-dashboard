apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-insight
  namespace: scientific-workflow
  labels:
    app: redis-insight
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-insight
  template:
    metadata:
      labels:
        app: redis-insight
    spec:
      containers:
        - name: redis-insight
          image: redislabs/redisinsight:latest
          ports:
            - containerPort: 5540
          env:
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"