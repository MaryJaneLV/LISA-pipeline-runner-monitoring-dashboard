apiVersion: v1
kind: ConfigMap
metadata:
  name: artifact-repositories
  namespace: scientific-workflow
  annotations:
    workflows.argoproj.io/default-artifact-repository: default-v1
data:
  default-v1: |
    archiveLogs: true
    s3:
      bucket: pipeline-runner-artifacts
      # Use key prefix to store all logs and artifacts in a user-specific or structured location
      keyPrefix: "{{workflow.parameters.artifactOutputPath}}/{{workflow.name}}"
      endpoint: minio:9000
      insecure: true
      accessKeySecret:
        name: minio-credentials
        key: accesskey
      secretKeySecret:
        name: minio-credentials
        key: secretkey
