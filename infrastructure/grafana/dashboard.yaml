apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: scientific-workflow
  labels:
    grafana_dashboard: 'true'
data:
  main-dashboard.json: |-
    $(cat infrastructure/grafana/dashboards/main-dashboard.json)
  argo-dashboard.json: |-
    $(cat infrastructure/grafana/dashboards/argo-dashboard.json)
  k8s.json: |-
    $(cat infrastructure/grafana/dashboards/k8s.json)
