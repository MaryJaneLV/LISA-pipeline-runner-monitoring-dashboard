apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: scientific-workflow
data:
  prometheus.yaml: |-
    {
      "apiVersion": 1,
      "datasources": [
        {
          "name": "Prometheus",
          "type": "prometheus",
          "url": "http://host.docker.internal:9090",
          "access": "proxy",
          "isDefault": true
        },
        {
          "name": "Loki",
          "type": "loki",
          "url": "http://loki:3100",
          "access": "proxy",
          "isDefault": false
        },
        {
          "name": "Thanos",
          "type": "prometheus",
          "url": "http://thanos-query:9090",
          "access": "proxy",
          "isDefault": false,
          "editable": true
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: scientific-workflow
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          volumeMounts:
            - mountPath: /var/lib/grafana
              name: grafana-storage
            - mountPath: /etc/grafana/provisioning/datasources
              name: grafana-datasources
              readOnly: true
            - mountPath: /etc/grafana/provisioning/dashboards
              name: grafana-dashboard-provider
              readOnly: true
            - mountPath: /etc/grafana/provisioning/dashboards/json
              name: grafana-dashboards
              readOnly: true
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-credentials
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-credentials
                  key: admin-password
            - name: GF_DASHBOARDS_MIN_REFRESH_INTERVAL
              value: '5s'
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: grafana-storage
          emptyDir: {}
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-dashboards
          configMap:
            name: grafana-dashboards
        - name: grafana-dashboard-provider
          configMap:
            name: grafana-dashboard-provider
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: scientific-workflow
  labels:
    app: grafana
spec:
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
      nodePort: 30300
  selector:
    app: grafana
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-credentials
  namespace: scientific-workflow
type: Opaque
data:
  admin-user: YWRtaW4= # base64 encoded "admin"
  admin-password: YWRtaW4= # base64 encoded "admin"
