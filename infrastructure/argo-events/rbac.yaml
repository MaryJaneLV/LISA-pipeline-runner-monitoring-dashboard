apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-events-role
  namespace: scientific-workflow
rules:
  # Access to Argo Workflow resources
  - apiGroups:
      - argoproj.io
    resources:
      - workflows
      - workflowtemplates
      - cronworkflows
      - workfloweventbindings
    verbs:
      - create
      - get
      - list
      - watch
      - update
      - patch
      - delete
  
  # Access to core resources
  - apiGroups:
      - ""
    resources:
      - configmaps
      - secrets
      - pods
      - services
      - events
    verbs:
      - get
      - list
      - watch
      - create
  
  # Leader election
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - get
      - list
      - watch
      - update
      - patch
      - delete

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-events-role-binding
  namespace: scientific-workflow
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argo-events-role
subjects:
  - kind: ServiceAccount
    name: argo-events-sa
    namespace: scientific-workflow
  - kind: ServiceAccount
    name: default
    namespace: scientific-workflow

---
# Add permissions to watch Kubernetes resources (for the resource eventsource)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argo-events-cluster-role
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - workflows
      - workflowtemplates
      - cronworkflows
      - clusterworkflowtemplates
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argo-events-cluster-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argo-events-cluster-role
subjects:
  - kind: ServiceAccount
    name: argo-events-sa
    namespace: scientific-workflow