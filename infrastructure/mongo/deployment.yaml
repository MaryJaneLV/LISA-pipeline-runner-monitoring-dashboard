apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: scientific-workflow
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
      - name: mongo
        image: mongo:6.0
        ports:
        - containerPort: 27017
        volumeMounts:
        - name: mongo-persistent-storage
          mountPath: /data/db
        resources:
          limits:
            memory: 1Gi
            cpu: 500m
          requests:
            memory: 500Mi
            cpu: 200m
  volumeClaimTemplates:
  - metadata:
      name: mongo-persistent-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: scientific-workflow
spec:
  ports:
  - port: 27017
    targetPort: 27017
  selector:
    app: mongo